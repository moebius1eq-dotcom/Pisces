<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; }

        .journey-wrap {
            height: 800vh;
            position: relative;
        }

        .journey-sticky {
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .cosmic-hud {
            position: absolute;
            bottom: 48px;
            left: 48px;
            width: 280px;
            z-index: 10;
            pointer-events: none;
            color: white;
            font-family: Arial, sans-serif;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 12px;
        }

        #hud-title {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 6px;
        }

        #hud-distance {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 18px;
        }

        .hud-progress {
            height: 2px;
            background: rgba(255, 255, 255, 0.15);
        }

        #hud-progress-fill {
            width: 0%;
            height: 100%;
            background: #b8d4ff;
            transition: width 0.15s linear;
        }

        @media (max-width: 600px) {
            .cosmic-hud {
                left: 24px;
                bottom: 28px;
                width: min(280px, calc(100% - 48px));
            }
        }

        .cosmic-context {
            position: absolute;
            bottom: 48px;
            right: 48px;
            width: 280px;
            z-index: 10;
            pointer-events: none;
            font-family: Arial, sans-serif;
        }

        .context-label {
            display: block;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 12px;
        }

        #context-description {
            font-size: 13px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.65);
        }

        @media (max-width: 700px) {
            .cosmic-context {
                display: none;
            }
        }

        #object-tooltip {
            position: absolute;
            z-index: 20;
            width: 240px;
            padding: 18px;
            background: rgba(12, 18, 28, 0.88);
            border: 1px solid rgba(180, 210, 255, 0.18);
            border-radius: 8px;
            backdrop-filter: blur(12px);
            font-family: Arial, sans-serif;
            color: white;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #tooltip-type {
            font-size: 9px;
            letter-spacing: 2px;
            color: #9cbce5;
        }

        #tooltip-name {
            font-size: 20px;
            font-weight: 400;
            margin: 8px, 0;
        }

        #tooltip-description {
            font-size: 12px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.65);
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Journey | Pisces</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="journey-wrap">
        <div class="journey-sticky">
            <canvas id="c"></canvas>
            <div id="object-tooltip">
                <span id="tooltip-type"></span>
                <h3 id="tooltip-name"></h3>
                <p id="tooltip-description"></p>
            </div>
            <div class="cosmic-hud">
                <div class="hud-top">
                    <span>ASTRO JOURNEY</span>
                    <span id="hud-count">01 / 08</span>
                </div>

                <h2 id="hud-title">Earth & Moon</h2>
                <p id="hud-distance">384,400 km apart</p>

                <div class="hud-progress">
                    <div id="hud-progress-fill"></div>
                </div>
            </div>
            <div class="cosmic-context">
                <span class="context-label">
                    UNDERSTANDING THE UNIVERSE
                </span>
                <p id="context-description"></p>
            </div>
        </div>
    </div>
    <script>
            const canvas = document.getElementById('c');
            const ctx = canvas.getContext('2d');
            const wrap = document.querySelector('.journey-wrap');
            const interactiveObjects = [];
            const tooltip = document.getElementById('object-tooltip');
            const tooltipType = document.getElementById('tooltip-type');
            const tooltipName = document.getElementById('tooltip-name');
            const tooltipDescription = document.getElementById(
                'tooltip-description'
            );  
            const backgroundStars = [];

            for (let i = 0; i < 350; i++) {
                backgroundStars.push({
                    x: Math.random(),
                    y: Math.random(),
                    radius: 0.3 + Math.random() * 0.9,
                    opacity: 0.1 + Math.random() * 0.4,
                    depth: Math.random()
                });
            }

            function resize() {
                canvas.width  = window.innerWidth;
                canvas.height = window.innerHeight;

                render();
            }

           window.addEventListener('resize', resize);

            function getProgress() {
                const scrollable = wrap.offsetHeight - window.innerHeight;
                return Math.max(0, Math.min(1, window.scrollY / scrollable));
            }

            function registerObject(x, y, radius, type, name, description) {
                interactiveObjects.push({
                    x,
                    y,
                    radius,
                    type,
                    name, 
                    description
                });
            }

            function drawBackground(progress) {
                ctx.save();

                ctx.fillStyle = '#000';
                ctx.fillRect(
                    0, 0,
                    canvas.width,
                    canvas.height
                );

                for (const star of backgroundStars) {
                    const offset =
                        progress * star.depth * 120;

                    const x = star.x * canvas.width;

                    const y = 
                        (star.y * canvas.height + offset)
                        % canvas.height;

                    ctx.beginPath();

                    ctx.arc(
                        x,
                        y,
                        star.radius,
                        0,
                        Math.PI * 2
                    );

                    ctx.fillStyle = 
                        `rgba(190, 210, 255, ${star.opacity})`;
                    
                    ctx.fill();
                }

                ctx.restore();
            }
            
            function getCameraAnchor(index) {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const size = Math.min(
                    canvas.width,
                    canvas.height
                );

                switch (index) {
                    case 1:
                        return {
                            x: cx,
                            y: cy - size * 0.31
                        };

                        case 2:
                            const orbitR = 
                                (Math.log(1 / 0.3) / 
                                Math.log(32 / 0.3)) *
                                size * 0.44;

                            return {
                                x: cx + Math.cos(2.2) * orbitR,
                                y: cy + Math.sin(2.2) * orbitR
                            };

                        case 4:
                            return {
                                x: cx + Math.cos(-0.6) *
                                    size * 0.42 * 0.52,
                                y: cy + Math.sin(-0.6) *
                                    size * 0.42 * 0.52 * 0.78
                            };

                        case 5:
                            return {
                                x: cx - size * 0.38 * 0.42,
                                y: cy + size * 0.38 * 0.12
                            };

                        case 6:
                            return {
                                x: cx - size * 0.40 * 0.60,
                                y: cy + size * 0.40 * 0.42
                            };

                        default:
                            return {
                                x: cx,
                                y: cy
                            };
                }
            }

            function lerp(start, end, t) {
                return start + (end - start) * t;
            }
            
            function render() {
                const p = getProgress();

                interactiveObjects.length = 0;
                tooltip.style.opacity = '0';
                canvas.style.cursor = 'default';

                const totalStages = 8;
                const position = p * totalStages;

                const stageIndex = Math.min(
                    Math.floor(position),
                    totalStages - 1
                );

                const nextStage = Math.min(
                    stageIndex + 1,
                    totalStages - 1
                );

                const progress = position - stageIndex;
                const transitionStart = 0.50;

                let t = Math.max(
                    0,
                    Math.min(
                        1, 
                        (progress - transitionStart) / (1 - transitionStart)
                    )
                );

                if (stageIndex === totalStages - 1) {
                    t = 0;
                }

                t = t * t * (3 - 2 * t);

                const displayedStage =
                    t >= 0.5 ? nextStage : stageIndex;

                updateHUD(displayedStage, p);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawBackground(p);
                ctx.save();
                ctx.globalAlpha = 1 - t;

                const outgoingScale = 1 - t * 0.35;

                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(outgoingScale, outgoingScale);
                ctx.translate(-canvas.width / 2, -canvas.height / 2);

                drawStage(stageIndex);

                ctx.restore();

                if (t > 0 && nextStage !== stageIndex) {
                    ctx.save();
                    ctx.globalAlpha = t;

                    const incomingScale = 2.5 - t * 1.5;

                    const anchor = getCameraAnchor(nextStage);

                    const cameraX = lerp(
                        anchor.x,
                        canvas.width / 2,
                        t
                    );

                    const cameraY = lerp(
                        anchor.y,
                        canvas.height / 2,
                        t
                    );

                    ctx.translate(
                        canvas.width / 2,
                        canvas.height / 2
                    );

                    ctx.scale(incomingScale, incomingScale);

                    ctx.translate(-cameraX, -cameraY);

                    drawStage(nextStage);

                    ctx.restore();
                }

            }

            function drawStage(index) {
                if (index === 0) drawEarth();
                if (index === 1) drawSolar1();
                if (index === 2) drawSolarSystem();
                if (index === 3) drawStars();
                if (index === 4) drawMilkyWay();
                if (index === 5) drawLocalGroup();
                if (index === 6) drawVirgoSupercluster();
                if (index === 7) drawObservableUniverse();
            }

            const stageInfo = [
                ['Earth & Moon', '384,400 km apart'],
                ['Sun & Earth', '1 astronomical unit'],
                ['Solar System', 'Neptune 30.1 AU'],
                ['Nearby Stars', 'Within 28 light-years'],
                ['Milky Way', '~100,000 light-years across'],
                ['Local Group', '~10 million light-years across'],
                ['Virgo Supercluster', '~110 million light-years across'],
                ['Observable Universe', '~92 billion light-years across']
            ];

            const stageDescriptions = [
                'The Moon is our closest celestial neighbor. Light takes approximately 1.28 seconds to travel between Earth and the Moon.',
                'Earth orbits the Sun at an average distance of approximately 149.6 million kilometers. Sunlight takes about eight minutes to reach us.',
                'Eight planets orbit our Sun. Beyond Neptune lie the Kuiper Belt and the distant regions of our Solar System.',
                'Even the closest star beyond our Sun, Proxima Centauri, lies more than four light-years away.',
                'Our Solar System resides within a barred spiral galaxy containing hundreds of billions of stars.',
                'The Milky Way belongs to the Local Group, a gravitationally associated collection of galaxies that includes Andromeda and Triangulum.',
                'The Virgo Supercluster encompasses numerous galaxy groups and clusters, including our own Local Group.',
                'The observable universe contains vast networks of galaxies separated by enormous cosmic voids. Its horizon represents the limit of what we can currently observe.'
            ];

            const contextDescription =
                document.getElementById('context-description');

            const hudTitle = document.getElementById('hud-title');
            const hudDistance = document.getElementById('hud-distance');
            const hudCount = document.getElementById('hud-count');
            const hudFill = document.getElementById('hud-progress-fill');

            function updateHUD(index, progress) {
                hudTitle.textContent = stageInfo[index][0];
                hudDistance.textContent = stageInfo[index][1];

                contextDescription.textContent = 
                    stageDescriptions[index];

                hudCount.textContent =
                    String(index + 1).padStart(2, '0') + ' / 08';

                hudFill.style.width =
                    (Math.min(1, Math.max(0, progress)) * 100) + '%';
            }

            let renderPending = false;

            function requestRender() {
                if (renderPending) return;

                renderPending = true;

                requestAnimationFrame(() => {
                    render();
                    renderPending = false;
                });
            }

            window.addEventListener('scroll', requestRender);

            function drawEarth() {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const eR = Math.min(canvas.width, canvas.height) * 0.18;
                const mR = eR * 0.27;
                const gap = canvas.width * 0.26;

                const ex = cx - gap * 0.35;
                const mx = cx + gap * 0.65;

                registerObject(
                    ex, 
                    cy,
                    eR,
                    'TERRESTRIAL PLANET',
                    'Earth',
                    'Diameter: 12,742 km. Orbital period: approximately 365.25 days.'
                );

                registerObject(
                    mx,
                    cy,
                    mR,
                    'NATURAL SATELLITE',
                    'Moon',
                    'Diameter: 3,474 km. Average distance from Earth: 384,400 km.'
                );

                canvas.addEventListener('mousemove', (event) => {
                    const rect = canvas.getBoundingClientRect();

                    const x = event.clientX - rect.left;
                    const y = event.clientY - rect.top;

                    const position = getProgress() * 8;
                    
                    const stageIndex = Math.min(
                        Math.floor(position),
                        7
                    );

                    const progress = position - stageIndex;

                    tooltip.style.opacity = '0';
                    tooltip.style.cursor = 'default';
                })

                const eGlow= ctx.createRadialGradient(ex, cy, eR * 0.8, ex, cy, eR * 1.6);
                eGlow.addColorStop(0, 'rgba(70, 150, 255, 0.15)');
                eGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.beginPath();
                ctx.arc(ex, cy, eR * 1.6, 0, Math.PI * 2);
                ctx.fillStyle = eGlow;
                ctx.fill();


                const eg = ctx.createRadialGradient(ex - eR * 0.2, cy - eR * 0.2, eR * 0.05, ex, cy, eR);
                eg.addColorStop(0, '#6bbfff');
                eg.addColorStop(0.35, '#2f7cc2');
                eg.addColorStop(0.7, '#1a4f8a');
                eg.addColorStop(1, '#091d38');

                ctx.beginPath();
                ctx.arc(ex, cy, eR, 0, Math.PI * 2);
                ctx.fillStyle = eg;
                ctx.fill();

                const mGlow = ctx.createRadialGradient(mx, cy, mR * 0.8, mx, cy, mR * 1.6);
                mGlow.addColorStop(0, 'rgba(180, 180, 180, 0.08)');
                mGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.beginPath();
                ctx.arc(mx, cy, mR * 1.6, 0, Math.PI * 2);
                ctx.fillStyle = mGlow;
                ctx.fill();

                const mg = ctx.createRadialGradient(mx - mR * 0.3, cy - mR * 0.3, mR * 0.05, mx, cy, mR);
                mg.addColorStop(0, '#d8d8d8');
                mg.addColorStop(0.5, '#888');
                mg.addColorStop(1, '#2e2e2e');

                ctx.beginPath();
                ctx.arc(mx, cy, mR, 0, Math.PI * 2);
                ctx.fillStyle = mg;
                ctx.fill();

            ctx.save();
            ctx.setLineDash([4, 8]);
            ctx.beginPath();
            ctx.moveTo(ex + eR + 4, cy);
            ctx.lineTo(mx - mR - 4, cy);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();

            ctx.textAlign = 'center';
            ctx.font = '11px sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.fillText('384,400 KM', (ex + mx) / 2, cy - 14);

            ctx.textAlign = 'left';
            ctx.font = '10px sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillText('EARTH', ex - 20, cy + eR +20);
            ctx.fillText('MOON', mx - 14, cy + mR + 16);
            }

            function drawSolar1() {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const sR = Math.min(canvas.width, canvas.height) * 0.09;
                const orbitR = Math.min(canvas.width, canvas.height) * 0.31;

                const sg = ctx.createRadialGradient(cx, cy, sR * 0.4, cx, cy, sR * 3);
                sg.addColorStop(0, 'rgba(255, 220, 80, 0.2)');
                sg.addColorStop(0.3, 'rgba(0, 0, 0, 0)');
                ctx.beginPath();
                ctx.arc(cx, cy, sR * 3, 0, Math.PI * 2);
                ctx.fillStyle = sg;
                ctx.fill();

                const sun = ctx.createRadialGradient(cx - sR * 0.3, cy - sR * 0.3, sR * 0.1, cx, cy, sR);
                sun.addColorStop(0, '#fffbe0');
                sun.addColorStop(0.3, '#ffd740');
                sun.addColorStop(0.7, '#ff8c00');
                sun.addColorStop(1, '#7a3800');
                ctx.beginPath();
                ctx.arc(cx, cy, sR, 0, Math.PI * 2);
                ctx.fillStyle = sun;
                ctx.fill();

                ctx.save();
                ctx.setLineDash([3, 7]);
                ctx.beginPath();
                ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();

                const angle = -Math.PI / 2;
                const ex = cx + Math.cos(angle) * orbitR;
                const ey = cy + Math.sin(angle) * orbitR;

                const eGlow = ctx.createRadialGradient(ex, ey, 0, ex, ey, 14);
                eGlow.addColorStop(0, 'rgba(80, 160, 255, 0.4)');
                eGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.beginPath();
                ctx.arc(ex, ey, 14, 0, Math.PI * 2);
                ctx.fillStyle = eGlow;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(ex, ey, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#5aacff';
                ctx.fill();

                ctx.textAlign = 'center';
                ctx.font = '10px sans-serif';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.fillText('1 AU · 149.6M KM', cx, cy - orbitR - 12);

                ctx.textAlign = 'left';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.fillText('SUN', cx + sR + 8, cy - sR - 8);
                ctx.fillText('EARTH', ex + 8, ey + 4);
            }

            function drawSolarSystem() {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const scale = Math.min(canvas.width, canvas.height) * 0.44;

                const planets = [
                    { name: 'MERCURY', au: 0.39, color: '#a8998c', r: 2.5, angle: 1.0 },
                    { name: 'VENUS', au: 0.72, color: '#e8c97a', r: 3.2, angle: 0.5 },
                    { name: 'EARTH', au: 1.00, color: '#5aacff', r: 3.5, angle: 2.2 },
                    { name: 'MARS', au: 1.52, color: '#cc4411', r: 2.8, angle: 3.4 },
                    { name: 'JUPITER', au: 5.20, color: '#c8884a', r: 7.0, angle: 0.9 },
                    { name: 'SATURN', au: 9.58, color: '#e8d49a', r: 5.5, angle: 4.1 },
                    { name: 'URANUS', au: 19.20, color: '#7de8e8', r: 4.2, angle: 1.7 },
                    { name: 'NEPTUNE', au: 30.05, color: '#4466dd', r: 4.0, angle: 2.0 },
                ];

                const logMin = Math.log(0.3);
                const logMax = Math.log(32);
                function auToRadius(au) {
                    return ((Math.log(au) - logMin) / (logMax - logMin)) * scale;
                }

                const sg = ctx.createRadialGradient(cx, cy, 4, cx, cy, 28);
                sg.addColorStop(0, 'rgba(255, 230, 100, 0.35)');
                sg.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.beginPath();
                ctx.arc(cx, cy, 28, 0, Math.PI * 2);
                ctx.fillStyle = sg;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(cx, cy, 7, 0, Math.PI * 2);
                ctx.fillStyle = '#ffe040';
                ctx.fill();

                for (const planet of planets) {
                    const orbitR = auToRadius(planet.au);

                    ctx.beginPath();
                    ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    const px = cx + Math.cos(planet.angle) * orbitR;
                    const py = cy + Math.sin(planet.angle) * orbitR;

                    ctx.beginPath();
                    ctx.arc(px, py, planet.r, 0, Math.PI * 2);
                    ctx.fillStyle = planet.color;
                    ctx.fill();
                }

                ctx.textAlign = 'center';
                ctx.font = '10px sans-serif';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillText('NEPTUNE · 30.1AU', cx, cy + auToRadius(30.1) + 16);
            }

            function drawStars() {
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const scale = Math.min(canvas.width, canvas.height) * 0.38;

                const nearStars = [
                    { name: 'PROXIMA CENTAURI', ly: 4.24, angle: -0.6 },
                    { name: 'ALPHA CENTAURI', ly: 4.37, angle: -0.25 },
                    { name: 'BARNARDS STAR', ly: 5.96, angle: 1.8 },
                    { name: 'WOLF 359', ly: 7.78, angle: 2.5 },
                    { name: 'SIRIUS', ly: 8.60, angle: 0.75 },
                    { name: 'EPSILON ERIDANI', ly: 10.5, angle: -1.9 },
                    { name: 'TAU CETI', ly: 11.9, angle: 2.1 },
                    { name: 'VEGA', ly: 25.0, angle: 0.2 },
                ];

                const maxLY = 28;

                for (const ly of [5, 10, 20]) {
                    const r = (ly / maxLY) * scale;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.textAlign = 'left';
                    ctx.font = '9px sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.fillText(ly + ' LY', cx + r + 5, cy + 3);
                }

                for (const star of nearStars) {
                    const r = (star.ly / maxLY) * scale;
                    const sx = cx + Math.cos(star.angle) * r;
                    const sy = cy + Math.sin(star.angle) * r;

                    const brightness = 0.5 + (1 - star.ly / maxLY) * 0.5;
                    const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 10);
                    glow.addColorStop(0, `rgba(255, 250, 220, ${brightness * 0.3})`);
                    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    ctx.beginPath();
                    ctx.arc(sx, sy, 10, 0, Math.PI * 2);
                    ctx.fillStyle = glow;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(sx, sy, 2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 210, ${brightness})`;
                    ctx.fill();

                    if (star.ly < 12) {
                        ctx.textAlign = 'left';
                        ctx.font = '9px sans-serif';
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                        ctx.fillText(star.name, sx + 7, sy + 3);
                    }

                }

                const sunGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 16);
                sunGlow.addColorStop(0, 'rgba(255, 230, 80, 0.5)');
                sunGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.beginPath();
                ctx.arc(cx, cy, 16, 0, Math.PI * 2);
                ctx.fillStyle = sunGlow;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(cx, cy, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffe040';
                ctx.fill();

                ctx.textAlign = 'left';
                ctx.font = '9px sans-serif';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fillText('THE SUN', cx + 7, cy - 10);
            }

            function drawMilkyWay() {
                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    const scale = Math.min(canvas.width, canvas.height) * 0.42;

                    const disk = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale);
                    disk.addColorStop(0, 'rgba(255, 220, 160, 0.13)');
                    disk.addColorStop(0.3, 'rgba(110, 150, 255, 0.08)');
                    disk.addColorStop(1, 'rgba(0, 0, 0, 0)');

                    ctx.fillStyle = disk;
                    ctx.beginPath();
                    ctx.arc(cx, cy, scale, 0, Math.PI * 2);
                    ctx.fill();

                    for (let arm = 0; arm < 4; arm++) {
                        for (let i = 0; i < 1100; i++) {
                            const t = i / 1100;
                            const angle = arm * Math.PI / 2 + t * Math.PI * 3.2;

                            const radius = (0.08 + t * 0.88) * scale;

                            const seed = Math.sin(i * 127.1 + arm * 311.7) * 43758.5453;
                            const random = seed - Math.floor(seed);
                            const spread = (random - 0.5) * 0.22 * scale * (0.3 + t);

                            const r = radius + spread;
                            const x = cx + Math.cos(angle) * r;
                            const y = cy + Math.sin(angle) * r * 0.78;

                            const brightness = 0.15 + random * 0.65;

                            ctx.fillStyle = `rgba(170, 200, 255, ${brightness})`;
                            ctx.beginPath();
                            ctx.arc(x, y, 0.4 + random * 0.9, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                            const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale * 0.2);
                            core.addColorStop(0, 'rgba(255, 245, 200, 0.95)');
                            core.addColorStop(0.2, 'rgba(255, 205, 120, 0.65)');
                            core.addColorStop(1, 'rgba(255, 170, 70, 0)');

                            ctx.fillStyle = core;
                            ctx.beginPath();
                            ctx.arc(cx, cy, scale * 0.2, 0, Math.PI * 2);
                            ctx.fill();

                            const sunAngle = -0.6;
                            const sunRadius = scale * 0.52;
                            const sx = cx + Math.cos(sunAngle) * sunRadius;
                            const sy = cy + Math.sin(sunAngle) * sunRadius * 0.78;

                            ctx.beginPath();
                            ctx.arc(sx, sy, 3, 0, Math.PI * 2);
                            ctx.fillStyle = '#ffe070';
                            ctx.fill();

                            ctx.strokeStyle = 'rgba(255, 225, 130, 0.5)';
                            ctx.beginPath();
                            ctx.arc(sx, sy, 7, 0, Math.PI * 2);
                            ctx.stroke();

                            ctx.textAlign = 'left';
                            ctx.font = '10px sans-serif';
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
                            ctx.fillText('SOLAR SYSTEM', sx + 12, sy - 8);

                            ctx.textAlign = 'center';
                            ctx.font = '12px sans-serif';
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                            ctx.fillText('THE MILKY WAY', cx, cy + scale * 0.85 + 22);

                            ctx.font = '10px sans-serif';
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                            ctx.fillText('~100,000 LIGHT-YEARS ACROSS', cx, cy + scale * 0.85 + 39);
                }

                function drawLocalGroup() {
                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    const scale = Math.min(canvas.width, canvas.height) * 0.38;

                    const galaxies = [
                        { name: 'MILKY WAY', x: -0.42, y: 0.12, r: 24, color: '#9bbcff' },
                        { name: 'ANDROMEDA (M31)', x: 0.38, y: -0.28, r: 29, color: '#ffe0b0' },
                        { name: 'TRIANGULUM (M33)', x: 0.60, y: 0.42, r: 13, color: '#b4caff' },
                        { name: 'LARGE MAGELLANIC CLOUD', x: -0.65, y: 0.48, r: 9, color: '#a7caff' },
                        { name: 'SMALL MAGELLANIC CLOUD', x: -0.80, y: 0.67, r: 8, color: '#a7caff' },
                    ];

                    ctx.save();
                    ctx.setLineDash([4, 9]);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, scale * 1.2, scale * 0.92, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();

                    for (const galaxy of galaxies) {
                        const gx = cx + galaxy.x * scale;
                        const gy = cy + galaxy.y * scale;

                        const glow = ctx.createRadialGradient(gx, gy, 0, gx, gy, galaxy.r * 2);
                        glow.addColorStop(0, galaxy.color);
                        glow.addColorStop(0.15, 'rgba(170, 190, 255, 0.35)');
                        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');

                        ctx.fillStyle = glow;
                        ctx.beginPath();
                        ctx.arc(gx, gy, galaxy.r * 2, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.save();
                        ctx.translate(gx, gy);
                        ctx.rotate(-0.35);
                        ctx.scale(1, 0.48);

                        ctx.beginPath();
                        ctx.arc(0, 0, galaxy.r, 0, Math.PI * 2);
                        ctx.fillStyle = galaxy.color;
                        ctx.globalAlpha *= 0.55;
                        ctx.fill();

                        ctx.restore();

                        ctx.textAlign = 'center';
                        ctx.font = '9px sans-serif';
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
                        ctx.fillText(galaxy.name, gx, gy + galaxy.r + 19);
                    }

                    const mwx = cx - 0.42 * scale;
                    const mwy = cy + 0.12 * scale;
                    const ax = cx + 0.38 * scale;
                    const ay = cy - 0.28 * scale;

                    ctx.save();
                    ctx.setLineDash([3, 7]);
                    ctx.beginPath();
                    ctx.moveTo(mwx, mwy);
                    ctx.lineTo(ax, ay);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
                    ctx.stroke();
                    ctx.restore();

                    ctx.textAlign = 'center';
                    ctx.font = '12px sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.fillText('THE LOCAL GROUP', cx, cy - scale - 35);
                    
                    ctx.font = '10px sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.fillText('~ 10 MILLION LIGHT-YEARS ACROSS', cx, cy - scale - 10);
                }

                function drawVirgoSupercluster() {
                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    const scale = Math.min(canvas.width, canvas.height) * 0.40;

                    const clusters = [
                        { name: 'VIRGO CLUSTER', x: 0.05, y: -0.08, size: 75, count: 190 },
                        { name: 'LOCAL GROUP', x: -0.60, y: 0.42, size: 18, count: 12 },
                        { name: 'FORNAX CLUSTER', x: 0.42, y: 0.63, size: 38, count: 85 },
                        { name: 'ERIDANUS GROUPS', x: -0.45, y: -0.53, size: 32, count: 65 },
                        { name: 'CANES VENATICI GROUPS', x: 0.65, y: -0.55, size: 27, count: 50 }
                    ];

                    ctx.save();
                    ctx.setLineDash([3, 9]);
                    ctx.strokeStyle= 'rgba(150, 180, 255, 0.12)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, scale * 1.15, scale * 0.9, -0.25, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();

                    for (let c = 0; c < clusters.length; c++) {
                        const cluster = clusters[c];
                        const gx = cx + cluster.x * scale;
                        const gy = cy + cluster.y * scale;

                        const glow = ctx.createRadialGradient(
                            gx, gy, 0, gx, gy, cluster.size
                        );

                        glow.addColorStop(0, 'rgba(150, 190, 255, 0.11)');
                        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');

                        ctx.fillStyle = glow;
                        ctx.beginPath();
                        ctx.arc(gx, gy, cluster.size, 0, Math.PI * 2);
                        ctx.fill();

                        for (let i = 0; i < cluster.count; i++) {
                            const seed = Math.sin(
                                (i + 1) * 127.1 + c * 311.7
                            ) * 43758.5453;

                            const random = seed - Math.floor(seed);

                            const seed2 = Math.sin(
                                (i + 1) * 269.5 + c * 183.3
                            ) * 24634.6345;

                            const random2 = seed2 - Math.floor(seed2);

                            const angle = random * Math.PI * 2;
                            const radius = Math.sqrt(random2) * cluster.size * 0.75;

                            const x = gx + Math.cos(angle) * radius;
                            const y = gy + Math.sin(angle) * radius * 0.7;

                            ctx.beginPath();
                            ctx.arc(x, y, 0.5 + random * 1.1, 0, Math.PI * 2);
                            ctx.fillStyle = `rgba(190, 210, 255, ${0.25 + random2 * 0.65})`;
                            ctx.fill();
                        }

                        ctx.textAlign = 'center';
                        ctx.font = '9px sans-serif';
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
                        ctx.fillText(cluster.name, gx, gy + cluster.size * 0.8 + 16);
                    }

                    const lx = cx - 0.60 * scale;
                    const ly = cy + 0.42 * scale;

                    ctx.beginPath();
                    ctx.arc(lx, ly, 5, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 225, 130, 0.8)';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.textAlign = 'center';
                    ctx.font = '12px sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.fillText('THE VIRGO SUPERCLUSTER', cx, cy - scale - 35);

                    ctx.font = '10px sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.fillText('~110 MILLION LIGHT-YEARS ACROSS', cx, cy - scale - 18);
                }

                function drawObservableUniverse() {
                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    const scale = Math.min(canvas.width, canvas.height) * 0.39;

                    function random(seed) {
                        const n = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
                        return n - Math.floor(n);
                    }

                    const nodes = [];

                    for (let i = 0; i < 48; i++) {
                        const angle = random(i * 3 + 1) * Math.PI * 2;
                        const radius = Math.sqrt(random(i * 3 + 2)) * scale * 0.92;

                        nodes.push({
                            x: cx + Math.cos(angle) * radius,
                            y: cy + Math.sin(angle) * radius,
                            size: 1.5 + random(i * 3 + 3) * 3
                        });
                    }

                    ctx.save();
                    ctx.setLineDash([2, 7]);
                    ctx.beginPath();
                    ctx.arc(cx, cy, scale, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(160, 190, 255, 0.16)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.restore();

                    const maxDistance = scale * 0.40;

                    for (let i = 0; i < nodes.length; i++) {
                        for (let j = i + 1; j < nodes.length; j++) {
                            const a = nodes[i];
                            const b = nodes[j];

                            const dx = a.x - b.x;
                            const dy = a.y - b.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance < maxDistance) {
                                const alpha = (1 - distance / maxDistance) * 0.18;

                                ctx.beginPath();
                                ctx.moveTo(a.x, a.y);
                                ctx.lineTo(b.x, b.y);
                                ctx.strokeStyle = `rgba(120, 170, 255, ${alpha})`;
                                ctx.lineWidth = 0.7;
                                ctx.stroke();
                            }
                        }
                    }

                    for (let i = 0; i < nodes.length; i++) {
                        const a = nodes[i];

                        let nearest = null;
                        let nearestDistance = Infinity;

                        for (let j = 0; j < nodes.length; j++) {
                            if (i === j) continue;

                            const b = nodes[j];
                            const distance = Math.hypot(a.x - b.x, a.y - b.y);

                            if (distance < nearestDistance) {
                                nearestDistance = distance;
                                nearest = b;
                            }
                        }

                        if (!nearest) continue;

                        for (let k = 0; k < 45; k++) {
                            const t = random(i * 100 + k + 1);

                            const x = a.x + (nearest.x - a.x) * t;
                            const y = a.y + (nearest.y - a.y) * t;

                            const spread = 4 + random(i * 200 + k) * 10;
                            const offsetX = (random(i * 300 + k) - 0.5) * spread;
                            const offsetY = (random(i * 400 + k) - 0.5) * spread;

                            ctx.beginPath();
                            ctx.arc(
                                x + offsetX,
                                y + offsetY,
                                0.3 + random(i * 500 + k) * 0.7,
                                0,
                                Math.PI * 2
                            );

                            ctx.fillStyle = 'rgba(170, 205, 255, 0.35)';
                            ctx.fill();
                        }
                    }

                    for (const node of nodes) {
                        const glow = ctx.createRadialGradient(
                            node.x, node.y, 0,
                            node.x, node.y, node.size * 5
                        );

                        glow.addColorStop(0, 'rgba(210, 230, 255, 0.65)');
                        glow.addColorStop(0.3, 'rgba(120, 170, 255, 0.18)');
                        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');

                        ctx.beginPath();
                        ctx.arc(node.x, node.y, node.size * 5, 0, Math.PI * 2);
                        ctx.fillStyle = glow;
                        ctx.fill();
                    }

                    ctx.beginPath();
                    ctx.arc(cx, cy, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffe6a0';
                    ctx.fill();

                    ctx.textAlign = 'left';
                    ctx.font = '9px sans-serif';
                    ctx.fillStyle = 'rgba(255, 230, 160, 0.7)';
                    ctx.fillText('OBSERVER', cx + 9, cy - 8);

                    ctx.textAlign = 'center';
                    ctx.font = '12px sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.fillText(
                        'THE OBSERVABLE UNIVERSE',
                        cx, 
                        cy - scale - 35
                    );

                    ctx.font = '10px sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                    ctx.fillText(
                        '~92 BILLION LIGHT-YEARS ACROSS',
                        cx, 
                        cy - scale - 18
                    );

                    ctx.font = '9px sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                    ctx.fillText(
                        'GALAXY FILAMENTS · CLUSTERS · COSMIC VOIDS',
                        cx,
                        cy + scale + 22
                    );
                }
                resize();
        </script>
